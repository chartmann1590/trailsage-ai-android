name: Android Release Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore decoded."
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - building an unsigned release."
          fi

      - run: chmod +x gradlew

      - name: Run unit tests
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARD_ID: ${{ secrets.ADMOB_REWARD_ID }}
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APK + AAB
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARD_ID: ${{ secrets.ADMOB_REWARD_ID }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Bump versionCode on every run; versionName tracks it for clarity.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Stage release assets with versioned names
        id: stage
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk "release-assets/trailsage-v0.1.${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/*.aab "release-assets/trailsage-v0.1.${{ github.run_number }}.aab"
          ls -lh release-assets

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: trailsage-release-apk
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: trailsage-release-aab
          path: release-assets/*.aab
          if-no-files-found: error

      # Publish a GitHub Release with the signed APK + AAB attached. Only on main so feature
      # branches don't spam releases; the tag matches the app versionName for traceability.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: TrailSage AI v0.1.${{ github.run_number }}
          body: |
            Automated release build.

            - versionName: `0.1.${{ github.run_number }}`
            - versionCode: `${{ github.run_number }}`
            - commit: ${{ github.sha }}

            Assets: signed release APK (sideload) and AAB (Play Store upload).
          files: |
            release-assets/*.apk
            release-assets/*.aab
          fail_on_unmatched_files: true
