name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      confirm_play_publish:
        description: 'Type "publish" to confirm submission to Google Play production'
        required: true
        default: ''
      release_notes:
        description: 'Release notes (optional; uses recent commits if empty)'
        required: false
        default: ''

jobs:
  publish:
    name: Build & publish to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check confirmation
        if: github.event.inputs.confirm_play_publish != 'publish'
        run: |
          echo "::error::You must type 'publish' in confirm_play_publish to proceed."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if echo "$GOOGLE_SERVICES_JSON" | grep -q "^[A-Za-z0-9+/=]*$"; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          else
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: chmod +x gradlew

      - name: Compute version
        id: version
        run: |
          VERSION_CODE="$(date -u +'%y%j%H%M')"
          VERSION_NAME="0.1.${VERSION_CODE}"
          echo "APP_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Run unit tests
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARD_ID: ${{ secrets.ADMOB_REWARD_ID }}
        run: ./gradlew testDebugUnitTest

      - name: Build signed release AAB
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARD_ID: ${{ secrets.ADMOB_REWARD_ID }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ env.APP_VERSION_CODE }}
          VERSION_NAME: ${{ env.APP_VERSION_NAME }}
        run: ./gradlew bundleRelease

      - name: Generate release notes
        run: |
          WHATSNEW_DIR="distribution/whatsnew"
          mkdir -p "${WHATSNEW_DIR}"
          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > "${WHATSNEW_DIR}/whatsnew-en-US"
          elif git describe --tags --abbrev=0 HEAD^ 2>/dev/null; then
            PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null)"
            git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' > "${WHATSNEW_DIR}/whatsnew-en-US"
          else
            printf '%s\n' "Bug fixes and performance improvements." > "${WHATSNEW_DIR}/whatsnew-en-US"
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Verify service account key
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is missing."
            exit 1
          fi
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.charles.trailsage
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          whatsNewDirectory: distribution/whatsnew
