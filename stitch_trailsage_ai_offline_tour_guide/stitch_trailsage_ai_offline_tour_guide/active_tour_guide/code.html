<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TrailSage AI - Active Tour</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "on-background": "#1b1c19",
                        "secondary-fixed": "#f4dfcb",
                        "surface-container-low": "#f5f3ee",
                        "tertiary-container": "#3f2700",
                        "secondary-container": "#f4dfcb",
                        "primary-fixed": "#d0e9d4",
                        "primary-fixed-dim": "#b4cdb8",
                        "on-primary-fixed": "#0b2013",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#c3c8c1",
                        "background": "#fbf9f4",
                        "primary-container": "#1b3022",
                        "surface-bright": "#fbf9f4",
                        "on-tertiary-container": "#c5871d",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#f2f1ec",
                        "tertiary-fixed": "#ffddb3",
                        "on-tertiary-fixed-variant": "#633f00",
                        "on-surface": "#1b1c19",
                        "on-primary-fixed-variant": "#364c3c",
                        "primary": "#061b0e",
                        "outline": "#737973",
                        "on-surface-variant": "#434843",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e4e2dd",
                        "on-tertiary-fixed": "#291800",
                        "on-secondary-fixed-variant": "#524436",
                        "tertiary": "#241400",
                        "surface": "#fbf9f4",
                        "tertiary-fixed-dim": "#ffb951",
                        "error-container": "#ffdad6",
                        "surface-dim": "#dbdad5",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#819986",
                        "secondary-fixed-dim": "#d7c3b0",
                        "on-secondary-fixed": "#241a0e",
                        "inverse-primary": "#b4cdb8",
                        "surface-container": "#f0eee9",
                        "secondary": "#6b5c4c",
                        "inverse-surface": "#30312e",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "surface-container-high": "#eae8e3",
                        "on-secondary-container": "#716252",
                        "surface-variant": "#e4e2dd",
                        "surface-tint": "#4d6453"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding-mobile": "20px",
                        "unit": "8px",
                        "safe-area-bottom": "32px",
                        "gutter": "16px",
                        "touch-target-min": "48px",
                        "container-padding-desktop": "40px"
                    },
                    "fontFamily": {
                        "label-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "title-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-sm": ["11px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        .map-bg {
            background-color: #e5e3df; /* Placeholder for actual map */
            background-image: radial-gradient(#d4d2ce 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md h-screen w-full overflow-hidden flex flex-col relative">
<!-- TopAppBar (Suppressed per logic: Active Tour / Linear flow) -->
<!-- We will use a minimal floating header for status instead -->
<!-- Map Canvas (Level 0) -->
<div class="absolute inset-0 map-bg z-0" data-location="Mohawk Valley" style="">
<!-- Route Line (Visual representation) -->
<svg class="absolute top-1/4 left-1/4 w-1/2 h-1/2 overflow-visible" style="opacity: 0.6;">
<path d="M0,50 Q100,100 150,0 T300,50" fill="none" stroke="#061b0e" stroke-linecap="round" stroke-width="8"></path>
</svg>
<!-- Current Location Pin -->
<div class="absolute top-[35%] left-[45%] flex flex-col items-center">
<div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center shadow-lg border-4 border-white relative z-10">
<span class="material-symbols-outlined text-white text-2xl fill-icon">navigation</span>
</div>
<!-- Pulse effect -->
<div class="absolute w-12 h-12 bg-primary rounded-full animate-ping opacity-30"></div>
</div>
<!-- Upcoming Trigger Pin -->
<div class="absolute top-[25%] left-[65%] flex flex-col items-center">
<div class="w-8 h-8 bg-tertiary-container rounded-full flex items-center justify-center shadow-md border-2 border-white">
<span class="material-symbols-outlined text-on-tertiary-container text-sm fill-icon">history_edu</span>
</div>
</div>
</div>
<!-- Floating Status Bar -->
<div class="absolute top-0 w-full p-container-padding-mobile flex justify-between items-start z-20 pointer-events-none">
<div class="flex gap-2 pointer-events-auto">
<button aria-label="Exit Tour" class="w-touch-target-min h-touch-target-min rounded-full bg-white/70 backdrop-blur-xl flex items-center justify-center text-primary shadow-sm hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="flex flex-col items-end gap-2 pointer-events-auto">
<!-- Offline Badge -->
<div class="flex items-center gap-1 bg-surface-container-high/90 backdrop-blur-md px-3 py-1.5 rounded-full shadow-sm border border-outline-variant/30">
<span class="material-symbols-outlined text-sm text-primary">offline_pin</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Offline Mode</span>
</div>
<!-- GPS Badge -->
<div class="flex items-center gap-1 bg-surface-container-high/90 backdrop-blur-md px-3 py-1.5 rounded-full shadow-sm border border-outline-variant/30">
<span class="material-symbols-outlined text-sm text-primary">satellite_alt</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">GPS Stable</span>
</div>
</div>
</div>
<!-- Bottom Control Sheet (Level 3 Glassmorphism / Level 1 Surface) -->
<div class="absolute bottom-0 w-full bg-surface/95 backdrop-blur-2xl rounded-t-3xl shadow-[0_-8px_32px_rgba(6,27,14,0.15)] z-30 pb-safe-area-bottom border-t border-white/50 flex flex-col transition-transform duration-300">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-3 pb-1">
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full"></div>
</div>
<div class="px-container-padding-mobile py-4 flex flex-col gap-6">
<!-- Road & Next Story Info -->
<div class="flex flex-col gap-1 text-center">
<div class="font-label-lg text-label-lg text-primary uppercase tracking-wider flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[16px]">signpost</span>
                    Scenic Route 7 - Mohawk Valley
                </div>
<div class="mt-4 p-4 bg-surface-container-low rounded-xl border border-outline-variant/30 relative overflow-hidden">
<!-- Progress Bar Background -->
<div class="absolute bottom-0 left-0 h-1 bg-surface-variant w-full"></div>
<!-- Progress Bar Fill (Simulating proximity) -->
<div class="absolute bottom-0 left-0 h-1 bg-tertiary-container w-[70%]"></div>
<h3 class="font-headline-md text-headline-md text-on-background mb-1">The Great Flood of 1914</h3>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-sm">location_on</span>
                        Upcoming • 1.2 miles away
                    </p>
</div>
</div>
<!-- Audio Controls -->
<div class="flex items-center justify-center gap-6 md:gap-12 w-full">
<!-- Replay -->
<button class="w-14 h-14 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined text-3xl">replay_10</span>
</button>
<!-- Play/Pause (Oversized) -->
<button class="w-20 h-20 md:w-24 md:h-24 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all active:scale-95 active:translate-y-0 relative">
<!-- Pulse ring for active audio -->
<div class="absolute inset-0 rounded-full border-2 border-primary opacity-20 animate-ping"></div>
<span class="material-symbols-outlined text-5xl fill-icon">pause</span>
</button>
<!-- Skip -->
<button class="w-14 h-14 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined text-3xl">forward_30</span>
</button>
</div>
<!-- AI & Secondary Actions -->
<div class="flex justify-between items-center pt-2">
<!-- Safety Badge -->
<div class="flex items-center gap-2 text-on-surface-variant opacity-70">
<span class="material-symbols-outlined text-sm">warning</span>
<span class="font-label-sm text-label-sm">Passenger controls recommended</span>
</div>
<!-- Ask AI Button (FAB style) -->
<button class="flex items-center gap-2 bg-secondary-container text-on-secondary-container px-5 py-3 rounded-full font-label-lg text-label-lg shadow-[0_4px_12px_rgba(6,27,14,0.1)] hover:bg-tertiary-fixed hover:-translate-y-0.5 transition-all active:scale-95">
<span class="material-symbols-outlined fill-icon text-tertiary-container">psychology</span>
                    Ask TrailSage
                </button>
</div>
</div>
</div>
</body></html>
