<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TrailSage AI - Driving Mode</title>
<!-- Material Symbols -->

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "on-secondary-fixed-variant": "#524436",
                    "on-secondary-fixed": "#241a0e",
                    "error-container": "#ffdad6",
                    "inverse-on-surface": "#f2f1ec",
                    "outline-variant": "#c3c8c1",
                    "tertiary-fixed-dim": "#ffb951",
                    "tertiary-container": "#3f2700",
                    "surface-tint": "#4d6453",
                    "surface-container-high": "#eae8e3",
                    "surface-bright": "#fbf9f4",
                    "outline": "#737973",

                    "secondary": "#6b5c4c",
                    "surface-variant": "#e4e2dd",
                    "on-tertiary-container": "#c5871d",
                    "on-error-container": "#93000a",
                    "secondary-container": "#f4dfcb",
                    "on-surface": "#1b1c19",
                    "on-tertiary-fixed-variant": "#633f00",

                    "surface-container-lowest": "#ffffff",

                    "surface-container-low": "#f5f3ee",
                    "on-secondary-container": "#716252",
                    "error": "#ba1a1a",
                    "secondary-fixed-dim": "#d7c3b0",
                    "primary": "#061b0e",
                    "on-primary-fixed-variant": "#364c3c"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "touch-target-min": "48px",
                    "container-padding-mobile": "20px",
                    "container-padding-desktop": "40px",
                    "unit": "8px",
                    "safe-area-bottom": "32px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "label-lg": ["Inter"],
                    "label-sm": ["Inter"],
                    "headline-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "body-lg": ["Inter"],
                    "body-md": ["Inter"],

            "fontSize": {

                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],

          }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-inverse-surface text-inverse-on-surface font-body-md h-screen w-full flex flex-col overflow-hidden antialiased">
<!-- TopAppBar (Adapted for Dark Driving Mode) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-container-padding-mobile h-touch-target-min backdrop-blur-xl bg-inverse-surface/80">
<button class="w-12 h-12 flex items-center justify-start hover:opacity-80 scale-95 duration-200">
<span class="material-symbols-outlined text-inverse-on-surface">signal_cellular_alt</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-inverse-on-surface">TrailSage AI</h1>
<button class="w-12 h-12 flex items-center justify-end hover:opacity-80 scale-95 duration-200">
<span class="material-symbols-outlined text-primary-fixed">offline_pin</span>
</button>
</header>
<!-- Main Driving Content -->
<main class="flex-grow flex flex-col items-center justify-center px-container-padding-mobile pt-20 pb-8 z-10 relative">
<!-- Safety Warning -->
<div class="absolute top-24 w-full text-center">
<p class="font-label-sm text-label-sm text-outline-variant uppercase tracking-[0.2em]">
<span class="material-symbols-outlined text-[14px] align-middle mr-1">warning</span>
                Passenger controls recommended
            </p>
</div>
<!-- Distance & Next Story Info -->
<div class="text-center mb-12 flex flex-col items-center mt-12">
<p class="font-title-lg text-title-lg text-outline-variant mb-2">Next Story In</p>
<h2 class="font-display-lg text-display-lg font-bold text-primary-fixed tracking-tight">1.2 mi</h2>
<p class="font-body-lg text-body-lg text-inverse-on-surface mt-4 max-w-[250px] leading-snug">
                "The Whispering Pines of Valley Forge"
            </p>
</div>
<!-- Huge Play/Pause Button -->
<button class="w-48 h-48 sm:w-56 sm:h-56 rounded-full bg-primary-fixed text-on-primary-fixed flex items-center justify-center shadow-[0_12px_40px_rgba(208,233,212,0.15)] active:scale-95 transition-all duration-300 hover:shadow-[0_16px_50px_rgba(208,233,212,0.25)] relative overflow-hidden group" id="main-play-btn">
<!-- Ripple Effect Container -->
<div class="absolute inset-0 rounded-full border-2 border-primary-fixed/30 scale-110 animate-[ping_3s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
<span class="material-symbols-outlined text-[80px] sm:text-[96px] group-hover:scale-110 transition-transform duration-300" style="font-variation-settings: 'FILL' 1;">
                play_arrow
            </span>
</button>
<!-- Secondary Controls -->
<div class="flex items-center justify-center space-x-12 mt-12">
<button class="flex flex-col items-center text-outline-variant hover:text-inverse-on-surface transition-colors active:scale-90">
<span class="material-symbols-outlined text-4xl mb-1">replay_30</span>
<span class="font-label-sm text-label-sm">Back</span>
</button>
<button class="flex flex-col items-center text-outline-variant hover:text-inverse-on-surface transition-colors active:scale-90">
<span class="material-symbols-outlined text-4xl mb-1">skip_next</span>
<span class="font-label-sm text-label-sm">Skip</span>
</button>
</div>
</main>
<!-- Minimal Map Strip -->
<section class="h-56 sm:h-64 w-full relative shrink-0 z-0">
<!-- Map Background Image -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-alt="A stylized, high-contrast dark mode GPS map interface displaying a winding road through a dense, dark forest. The map features deep charcoal and obsidian black terrain with a glowing, vibrant neon green route line indicating the path forward. The aesthetic is clean, modern, and highly legible for nighttime driving navigation." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuApmyBbp5Rn13EgbgBw7Sv7Z6jrud6lhSJoWxFqq4gymOJNI9Etj4OkS-YDLY7zREmv1wstCdTrXV755M-89W_e3qAuqalKfzDdjRQRldFUgpu8vk_Lxx1l9QU6i5bl3Bk3TMc25vHIzX-vmx06Z_-xVFXP3B9zBvQ8sUH_hOSx59GTqh_M0IpU6EnXmWoy1-udggzd72qzS-wsFGnxYsyvj_mo98_rOM3-nzbrLNlDJMkEyvWKD3ckiAKFE0xiRB-vdXif2Y6VV3g');">
</div>
<!-- Gradient Scrims for blending -->
<div class="absolute inset-0 bg-gradient-to-t from-inverse-surface/80 via-inverse-surface/40 to-inverse-surface"></div>
<div class="absolute inset-x-0 top-0 h-16 bg-gradient-to-b from-inverse-surface to-transparent"></div>
<!-- Floating Map Overlay Controls -->
<div class="absolute bottom-safe-area-bottom left-container-padding-mobile right-container-padding-mobile flex justify-between items-end">
<!-- Current Road -->
<div class="bg-surface/10 backdrop-blur-md border border-outline-variant/30 px-5 py-3 rounded-full flex items-center space-x-3 shadow-lg">
<div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-fixed text-[18px]" style="font-variation-settings: 'FILL' 1;">navigation</span>
</div>
<span class="font-label-lg text-label-lg text-inverse-on-surface font-bold tracking-wide">US-101 North</span>
</div>
<!-- Speed/Status -->
<div class="bg-surface/10 backdrop-blur-md border border-outline-variant/30 px-4 py-3 rounded-xl flex flex-col items-center justify-center shadow-lg min-w-[70px]">
<span class="font-headline-md text-headline-md font-bold text-inverse-on-surface leading-none">55</span>
<span class="font-label-sm text-label-sm text-outline-variant uppercase">mph</span>
</div>
</div>
</section>
<!-- Simple JS for Play Button Toggle -->
<script>
        document.getElementById('main-play-btn').addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            if (icon.innerText === 'play_arrow') {
                icon.innerText = 'pause';
                // Remove ping animation when paused
                this.querySelector('.animate-\\[ping_3s_cubic-bezier\\(0\\,0\\,0\\.2\\,1\\)_infinite\\]')?.classList.remove('animate-[ping_3s_cubic-bezier(0,0,0.2,1)_infinite]');
            } else {
                icon.innerText = 'play_arrow';
            }
        });
    </script>
</body></html>
