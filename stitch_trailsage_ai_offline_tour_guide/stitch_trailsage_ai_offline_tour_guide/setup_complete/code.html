<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TrailSage - Setup Complete</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#434843",
                        "on-tertiary-fixed-variant": "#633f00",
                        "on-tertiary-container": "#c5871d",
                        "surface-tint": "#4d6453",
                        "inverse-on-surface": "#f2f1ec",
                        "primary": "#061b0e",
                        "tertiary-container": "#3f2700",
                        "surface-container": "#f0eee9",
                        "primary-fixed": "#d0e9d4",
                        "on-primary": "#ffffff",
                        "primary-container": "#1b3022",
                        "tertiary": "#241400",
                        "error": "#ba1a1a",
                        "inverse-primary": "#b4cdb8",
                        "secondary-fixed-dim": "#d7c3b0",
                        "on-primary-fixed-variant": "#364c3c",
                        "outline": "#737973",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#291800",
                        "on-primary-fixed": "#0b2013",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#30312e",
                        "tertiary-fixed": "#ffddb3",
                        "surface-variant": "#e4e2dd",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#241a0e",
                        "surface-bright": "#fbf9f4",
                        "surface-container-low": "#f5f3ee",
                        "outline-variant": "#c3c8c1",
                        "primary-fixed-dim": "#b4cdb8",
                        "on-surface": "#1b1c19",
                        "surface-container-highest": "#e4e2dd",
                        "secondary-fixed": "#f4dfcb",
                        "tertiary-fixed-dim": "#ffb951",
                        "surface-container-high": "#eae8e3",
                        "on-secondary-fixed-variant": "#524436",
                        "on-primary-container": "#819986",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#dbdad5",
                        "surface": "#fbf9f4",
                        "secondary-container": "#f4dfcb",
                        "on-secondary": "#ffffff",
                        "secondary": "#6b5c4c",
                        "on-secondary-container": "#716252",
                        "on-tertiary": "#ffffff",
                        "on-background": "#1b1c19",
                        "background": "#fbf9f4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding-mobile": "20px",
                        "unit": "8px",
                        "touch-target-min": "48px",
                        "safe-area-bottom": "32px",
                        "gutter": "16px",
                        "container-padding-desktop": "40px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "title-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-scale-in {
            animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: scale(0.9);
        }
        @keyframes scaleIn {
            to { opacity: 1; transform: scale(1); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md antialiased overflow-x-hidden">
<!-- Hero Header Section -->
<header class="relative w-full h-[397px] shrink-0 bg-surface-container">
<!-- Scenic Road Image Background -->
<div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?ixlib=rb-4.0.3&amp;auto=format&amp;fit=crop&amp;w=1000&amp;q=80')] bg-cover bg-center" data-alt="A breathtaking view from inside a vehicle driving down a winding, open road through a lush, expansive valley. The scene is illuminated by warm, golden hour sunlight, casting soft shadows across the rugged mountains in the distance. The aesthetic is cinematic and adventurous, utilizing the Modern Naturalist color palette with deep greens and sunrise golds, evoking a strong sense of freedom and exploration.">
</div>
<!-- Gradient Scrim for Transition -->
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/60 to-transparent"></div>
<!-- Celebratory Badge overlay -->
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-1/2 z-10 animate-scale-in" style="animation-delay: 0.1s;">
<div class="bg-primary text-on-primary rounded-full p-4 shadow-[0_8px_24px_rgba(6,27,14,0.25)] ring-4 ring-background flex items-center justify-center relative overflow-hidden">
<span class="material-symbols-outlined z-10" style="font-size: 36px; font-variation-settings: 'FILL' 1;">check_circle</span>
<!-- Subtle pulsing background effect inside badge -->
<div class="absolute inset-0 bg-white/20 animate-ping" style="animation-duration: 3s;"></div>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col px-container-padding-mobile pt-14 pb-safe-area-bottom relative z-20">
<!-- Typography Anchor -->
<div class="text-center mb-8 animate-scale-in" style="animation-delay: 0.2s;">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">TrailSage is ready</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">Your modern naturalist guide is fully configured for the journey ahead.</p>
</div>
<!-- Success Cards (Bento Grid) -->
<div class="grid grid-cols-2 gap-unit mb-10 animate-scale-in" style="animation-delay: 0.3s;">
<!-- Card 1: AI Guide -->
<div class="bg-surface-container-lowest rounded-xl p-5 flex flex-col items-center justify-center text-center shadow-sm border border-outline-variant/40 relative overflow-hidden group">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary-fixed to-primary opacity-50"></div>
<div class="bg-primary-container text-on-primary-container rounded-full p-3 mb-3 group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">AI guide ready</span>
</div>
<!-- Card 2: Natural Voice -->
<div class="bg-surface-container-lowest rounded-xl p-5 flex flex-col items-center justify-center text-center shadow-sm border border-outline-variant/40 relative overflow-hidden group">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-secondary-fixed to-secondary opacity-50"></div>
<div class="bg-secondary-container text-on-secondary-container rounded-full p-3 mb-3 group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">record_voice_over</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Natural voice ready</span>
</div>
<!-- Card 3: Offline Map -->
<div class="bg-surface-container-lowest rounded-xl p-5 flex flex-col items-center justify-center text-center shadow-sm border border-outline-variant/40 relative overflow-hidden group">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-tertiary-fixed to-tertiary opacity-50"></div>
<div class="bg-tertiary-container text-on-tertiary-container rounded-full p-3 mb-3 group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">map</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Offline map ready</span>
</div>
<!-- Card 4: Sample Tour -->
<div class="bg-surface-container-lowest rounded-xl p-5 flex flex-col items-center justify-center text-center shadow-sm border border-outline-variant/40 relative overflow-hidden group">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-surface-tint to-primary opacity-50"></div>
<div class="bg-surface-variant text-on-surface-variant rounded-full p-3 mb-3 group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">route</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Sample tour ready</span>
</div>
</div>
<!-- Bottom Weighted Action Buttons -->
<div class="mt-auto flex flex-col gap-unit animate-scale-in" style="animation-delay: 0.4s;">
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg rounded-full h-touch-target-min flex items-center justify-center hover:opacity-90 active:scale-[0.98] transition-all duration-200 shadow-[0_4px_12px_rgba(6,27,14,0.1)]">
                Start Exploring
            </button>
<button class="w-full bg-transparent text-primary border-2 border-primary font-label-lg text-label-lg rounded-full h-touch-target-min flex items-center justify-center hover:bg-primary-fixed/20 active:scale-[0.98] transition-all duration-200">
                Open Sample Tour
            </button>
</div>
</main>
</body></html>
